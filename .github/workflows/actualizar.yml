name: Actualizar y publicar

# El MICM publica el aviso los viernes; los precios rigen desde el sábado.
# Se corre el sábado y otra vez el lunes por si el aviso salió tarde.
on:
  schedule:
    - cron: "0 14 * * 6"   # sábado 10:00 a. m. hora de RD
    - cron: "0 14 * * 1"   # lunes 10:00 a. m.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Descargar y limpiar datos
        run: python pipeline/build_data.py

      - name: Guardar los datos nuevos en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fuel.json data/raw/avisos.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos"
          else
            git commit -m "Datos: semana del $(date -u +%Y-%m-%d)"
            git push
          fi

      - run: python pipeline/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: actualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
